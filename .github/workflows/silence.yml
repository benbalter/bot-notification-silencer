name: Silence bot notifications

# Runs from this public repo so it doesn't spend private-repo Actions minutes.
on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      dry-run:
        description: Log what would be marked done without changing anything
        type: boolean
        default: true

jobs:
  silence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      # dist/ isn't committed to main, so build it before using the local action.
      - run: npm ci
      - run: npm run build && npm run package
      - uses: ./
        with:
          token: ${{ secrets.NOTIFICATIONS_TOKEN }}
          dry-run: ${{ inputs.dry-run || false }}
