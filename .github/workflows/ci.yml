name: 'build-test'
on:
  pull_request:
  push:
    branches:
      - main
      - 'releases/*'

jobs:
  build: 
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: 'npm'
      - run: npm install
      - run: npm run all